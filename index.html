<form id="kontakt-formular" action="https://formspree.io/f/xkoanygj" method="POST" class="contact-form">
    
    <div class="form-group">
        <label for="name">Ihr Name</label>
        <input type="text" id="name" name="name" placeholder="Z. B. Maria Müller" required>
    </div>

    <div class="form-group">
        <label for="email">Ihre E-Mail-Adresse</label>
        <input type="email" id="email" name="email" placeholder="name@beispiel.de" required>
    </div>

    <div class="form-group">
        <label for="phone">Telefonnummer (optional)</label>
        <input type="tel" id="phone" name="telefon" placeholder="Z. B. 0345 123456">
    </div>

    <div class="form-group">
        <label for="message">Ihre Nachricht an mich</label>
        <textarea id="message" name="message" rows="6" placeholder="Beschreiben Sie kurz, wobei ich Ihnen helfen kann..." required></textarea>
    </div>

    <p class="form-note">Beim Absenden des Formulars werden Ihre Daten zur Beantwortung Ihrer Anfrage an mich übermittelt. Weitere Informationen finden Sie in der <a href="datenschutz.html">Datenschutzerklärung</a>.</p>

    <button type="submit" id="submit-btn" class="btn-submit">Nachricht senden</button>
</form>
